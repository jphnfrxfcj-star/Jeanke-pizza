    <!-- Structured data voor Google (lokale zoekresultaten / rich results).

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "Jeanke's Pizza",
      "url": "https://www.secretpizza.be/",
      "image": "https://www.secretpizza.be/hero.jpg",
      "servesCuisine": "Italian",
      "description": "Handgemaakte pizza's uit de houtoven. Bestel uw tijdslot online.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "",
        "addressLocality": "",
        "postalCode": "",
        "addressCountry": "BE"
      },
      "acceptsReservations": "https://www.secretpizza.be/"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Hidden form for Netlify Forms detection at build time -->
    <form name="pizza-order" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="pizza-order" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="timeslot" />
      <input type="text" name="date" />
      <textarea name="order"></textarea>
      <input type="text" name="total" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>

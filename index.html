<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pizza-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jeanke's Pizza</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>

    <!-- Hidden form for Netlify Forms detection at build time -->
    <form name="pizza-order" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="pizza-order" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="timeslot" />
      <input type="text" name="date" />
      <textarea name="order"></textarea>
      <input type="text" name="total" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
